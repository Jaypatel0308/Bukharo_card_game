name: CI

# Runs on every pull request into main, and on main itself as a backstop.
# Render deploys straight off main, so a failure here is the last chance to
# catch a regression before four friends meet it mid-game.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One run per pull request, or per branch for a direct push. Keyed on the PR
# number rather than the ref, because a pull_request event and a push to the
# same branch carry different refs and would otherwise both run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # setup-node's cache holds the downloaded tarballs, not the installed
      # tree, so every job still unpacked and linked everything — four to seven
      # minutes each, against ninety seconds of actual work. This caches the
      # tree itself, keyed on the lock file, so an unchanged lock file means no
      # install at all.
      - name: Restore node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      # No restore-keys on purpose: a partial hit would leave a tree that does
      # not match the lock file, which is worse than installing.
      - name: Install
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --include=dev --no-audit --fund=false

      # Bugs rather than style: hook dependencies, unused bindings, missing
      # accessibility attributes. Warnings fail too, so suppressions stay
      # deliberate instead of accumulating.
      - run: npm run lint

      # Compiles every engine, the shared protocol, the server and the web
      # client, so a type error anywhere fails the build.
      - run: npm run build

      # The suites and the coverage numbers in one pass. These used to be two
      # jobs running the same tests twice, the second only to print a
      # percentage.
      - name: Test, with coverage
        run: |
          set -o pipefail
          npm run coverage 2>&1 | tee coverage.txt

      - name: Report coverage
        if: always()
        run: |
          {
            echo '### Coverage'
            echo
            echo 'Engine and server line coverage; the client is largely covered'
            echo 'by the browser job, which this does not see.'
            echo
            echo '```'
            grep -E "all files|All files" coverage.txt || tail -5 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The audits come last, and are bounded in the shell.
      #
      # They talk to the registry, and they used to run before the tests. On a
      # slow day the job hit its limit having never run lint, build or test — a
      # red build that said nothing about the code. A step that hits
      # `timeout-minutes` cancels the whole job, which `continue-on-error` does
      # not prevent, so the bound is a plain `timeout` instead.
      - name: Audit what ships
        if: always()
        run: |
          set +e
          timeout 180 npm audit --omit=dev --audit-level=high
          code=$?
          set -e
          if [ $code -eq 124 ]; then
            echo "::warning::npm audit did not finish in 180s; not treating that as a vulnerability"
          elif [ $code -ne 0 ]; then
            exit $code
          fi

      - name: Audit the toolchain (advisory only)
        if: always()
        run: |
          timeout 180 npm audit --audit-level=moderate > audit.txt 2>&1 \
            || echo '(the registry did not answer in time)' >> audit.txt
          {
            echo '### Dev dependency advisories'
            echo
            echo 'Not blocking: these are build and test tools, not shipped code.'
            echo
            echo '```'
            tail -20 audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --include=dev --no-audit --fund=false

      # Chromium is cached separately, since it is pinned to the Playwright
      # version rather than to the lock file as a whole.
      - name: Restore Chromium
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Its own job: downloading a browser is slow, and a failure here should
      # be distinguishable at a glance from a unit test failing.
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Everything above proves the code is good. This proves the site is.
  #
  # A green build says nothing about what players connect to: a failed deploy,
  # a stale bundle or a missing variable all look fine from CI until somebody
  # tries to start a game. This waits for Render to put this commit live and
  # then plays the first few seconds of one.
  deployed:
    name: deployed site
    needs: [test, browser]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --include=dev --no-audit --fund=false

      - name: Smoke test the deployment
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            {
              echo '### Deploy smoke test skipped'
              echo
              echo 'No `DEPLOY_URL` repository variable is set, so there is no'
              echo 'site to test. Add it under Settings → Secrets and variables'
              echo '→ Actions → Variables, e.g. `https://bukharo.onrender.com`.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "DEPLOY_URL is not set — skipping."
            exit 0
          fi
          node scripts/smoke.mjs "$DEPLOY_URL" "${{ github.sha }}"
