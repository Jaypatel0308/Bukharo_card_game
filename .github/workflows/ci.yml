name: CI

# Runs on every pull request into main, and on main itself as a backstop.
# Render deploys straight off main, so a failure here is the last chance to
# catch a regression before four friends meet it mid-game.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Headroom for a slow registry day: a seven-minute `npm ci` should not eat
    # the budget the tests need.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # --include=dev is explicit because TypeScript and Vite are dev
      # dependencies and there is nothing to build without them.
      # --no-audit and --fund skip two network round trips npm makes by
      # default; the audits we actually want run as their own step, after the
      # tests. --prefer-offline uses the cache setup-node just restored.
      # Installing was taking four to seven minutes against ninety seconds of
      # real work, three times over.
      - run: npm ci --include=dev --no-audit --fund=false --prefer-offline

      # Bugs rather than style: hook dependencies, unused bindings, missing
      # accessibility attributes. Warnings fail too, so suppressions stay
      # deliberate instead of accumulating.
      - run: npm run lint

      # Compiles the engine, the shared protocol, the server and the web
      # client, so a type error anywhere fails the build.
      - run: npm run build

      # The engine suite, the server suite against a real process, and the
      # client suite in jsdom.
      - run: npm test

      # The audits come last, and are bounded.
      #
      # They talk to the registry, and they used to run before the tests. On a
      # slow day `npm ci` took seven minutes and the two audits another nine,
      # so the job hit its limit having never once run lint, build or test —
      # a red build that said nothing about the code. Verification first;
      # anything network-bound afterwards, on a leash.
      #
      # Bounded in the shell rather than by `timeout-minutes`, because a step
      # that hits a step timeout cancels the whole job — `continue-on-error`
      # does not save it. A real advisory still fails the build; a registry
      # that will not answer only warns.
      - name: Audit what ships
        run: |
          set +e
          timeout 180 npm audit --omit=dev --audit-level=high
          code=$?
          set -e
          if [ $code -eq 124 ]; then
            echo "::warning::npm audit did not finish in 180s; not treating that as a vulnerability"
          elif [ $code -ne 0 ]; then
            exit $code
          fi

      - name: Audit the toolchain (advisory only)
        if: always()
        run: |
          timeout 180 npm audit --audit-level=moderate > audit.txt 2>&1 \
            || echo '(the registry did not answer in time)' >> audit.txt
          {
            echo '### Dev dependency advisories'
            echo
            echo 'Not blocking: these are build and test tools, not shipped code.'
            echo
            echo '```'
            tail -20 audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # --no-audit and --fund skip two network round trips npm makes by
      # default; the audits we actually want run as their own step, after the
      # tests. --prefer-offline uses the cache setup-node just restored.
      # Installing was taking four to seven minutes against ninety seconds of
      # real work, three times over.
      - run: npm ci --include=dev --no-audit --fund=false --prefer-offline

      # Reported, not enforced. A threshold here would mostly measure how much
      # of the client the jsdom suite happens to touch, when the browser job is
      # what actually covers it. The number is for reading, not for gating.
      - name: Measure coverage
        run: |
          npm run coverage > coverage.txt 2>&1 || true
          {
            echo '### Coverage'
            echo
            echo 'Engine and server line coverage; the client is largely covered'
            echo 'by the browser job, which this does not see.'
            echo
            echo '```'
            grep -E "all files|All files" coverage.txt || tail -5 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # --no-audit and --fund skip two network round trips npm makes by
      # default; the audits we actually want run as their own step, after the
      # tests. --prefer-offline uses the cache setup-node just restored.
      # Installing was taking four to seven minutes against ninety seconds of
      # real work, three times over.
      - run: npm ci --include=dev --no-audit --fund=false --prefer-offline

      # Its own job: downloading a browser is slow, and a failure here should
      # be distinguishable at a glance from a unit test failing.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Everything above proves the code is good. This proves the site is.
  #
  # A green build says nothing about what players connect to: a failed deploy,
  # a stale bundle or a missing variable all look fine from CI until somebody
  # tries to start a game. This waits for Render to put this commit live and
  # then plays the first few seconds of one.
  deployed:
    name: deployed site
    needs: [test, browser]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # --no-audit and --fund skip two network round trips npm makes by
      # default; the audits we actually want run as their own step, after the
      # tests. --prefer-offline uses the cache setup-node just restored.
      # Installing was taking four to seven minutes against ninety seconds of
      # real work, three times over.
      - run: npm ci --include=dev --no-audit --fund=false --prefer-offline

      - name: Smoke test the deployment
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            {
              echo '### Deploy smoke test skipped'
              echo
              echo 'No `DEPLOY_URL` repository variable is set, so there is no'
              echo 'site to test. Add it under Settings → Secrets and variables'
              echo '→ Actions → Variables, e.g. `https://bukharo.onrender.com`.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "DEPLOY_URL is not set — skipping."
            exit 0
          fi
          node scripts/smoke.mjs "$DEPLOY_URL" "${{ github.sha }}"
