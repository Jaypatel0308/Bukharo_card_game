# One free web service that builds the client and serves it alongside the
# websocket API. Render sets PORT itself; everything else has a sane default.
services:
  - type: web
    name: bukharo
    runtime: node
    plan: free
    # --include=dev is required: Render sets NODE_ENV=production, which would
    # otherwise skip TypeScript and Vite and leave nothing to build with.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    # Rooms live in this process's memory, so a second instance would not be
    # able to see the first one's games. Keep this at one.
    numInstances: 1
    # No persistent disk: this plan does not offer one, so every deploy hands
    # the service a fresh filesystem and any game in progress is lost. The
    # client says so plainly rather than dropping people to a bare error, and
    # /health reports how many rooms are live so a deploy can be held back
    # while people are still playing.
    envVars:
      - key: NODE_VERSION
        value: "22"
